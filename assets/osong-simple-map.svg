<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="map-title map-description">
  <title id="map-title">우리 동네 위치 그림지도</title>
  <desc id="map-description">청주 오송의 다섯 장소를 네 개의 대표 위치로 표시한 그림지도입니다. 북쪽에는 4번 오송생명과학단지 보건지소, 그 남쪽 동편에는 같은 대표 위치를 쓰는 1번 오송역과 2번 오송선하마루, 서쪽에는 3번 정중근린공원 물놀이장, 가장 남쪽에는 5번 오송읍 행정복지센터가 있습니다. 선하마루는 오송역 2층 3번 출구 방면입니다. 점선은 이름표 연결선이며 이동 경로가 아닙니다. 축척이 없으며 길 안내용이 아닙니다.</desc>
  <defs>
    <style>
      @font-face{font-family:Jua;src:url('Jua-Regular.ttf') format('truetype')}
      text{font-family:Jua,'Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#244d40}
      .heading{font-size:31px}.label{font-size:23px}.hint{font-size:17px;fill:#64776b}
      .number{font-size:25px;fill:white;text-anchor:middle}
      .leader{fill:none;stroke:#9cae9e;stroke-width:2.5;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round}
      .card{fill:#fffef8;stroke:#d7e3d4;stroke-width:2}
    </style>
    <filter id="soft-shadow" x="-15%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#244d40" flood-opacity=".08"/></filter>
    <pattern id="paper-dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1" fill="#dde5d4"/></pattern>
  </defs>
  <rect width="900" height="600" rx="28" fill="#fbf8e9"/>
  <rect x="18" y="86" width="864" height="456" rx="22" fill="url(#paper-dots)"/>
  <path d="M20 427C80 392 145 415 180 463C197 489 195 517 179 540H20Z" fill="#e6edcf"/>
  <path d="M748 383C811 356 856 382 882 406V540H799C823 486 721 446 748 383Z" fill="#e8edd6"/>
  <circle cx="42" cy="43" r="13" fill="#f28e72"/>
  <path d="M38 43l3 3 6-7" fill="none" stroke="#fffef8" stroke-width="3" stroke-linecap="round"/>
  <text x="65" y="55" class="heading">우리 동네 위치 그림지도</text>
  <rect x="658" y="28" width="207" height="35" rx="17" fill="#e2edda"/>
  <text x="761" y="52" text-anchor="middle" font-size="18">청주 오송 · 탐험 5곳</text>

  <path class="leader" d="M645 152H680"/>
  <g filter="url(#soft-shadow)" data-place-id="health">
    <rect x="355" y="109" width="290" height="87" rx="18" class="card"/>
    <text x="377" y="140" font-size="22">오송생명과학단지</text>
    <text x="377" y="174" font-size="18">보건지소 · 건강을 돕는 곳</text>
  </g>
  <circle cx="695" cy="152" r="26" fill="#3d8069" stroke="#fffef8" stroke-width="5"/>
  <text x="695" y="161" class="number">4</text>

  <g data-map-group="station">
    <rect x="373" y="226" width="310" height="163" rx="23" fill="#f5e8da" stroke="#dfc6b2" stroke-width="2"/>
    <g data-place-id="station">
      <rect x="387" y="240" width="282" height="57" rx="15" fill="#fffef8"/>
      <circle cx="418" cy="269" r="20" fill="#e98064"/>
      <text x="418" y="277" class="number" style="font-size:22px">1</text>
      <text x="453" y="264" class="label">오송역</text>
      <text x="453" y="286" class="hint" style="font-size:15px">기차를 타고 내리는 곳</text>
    </g>
    <g data-place-id="sunhamaru">
      <rect x="387" y="305" width="282" height="57" rx="15" fill="#fffef8"/>
      <circle cx="418" cy="334" r="20" fill="#3d8069"/>
      <text x="418" y="342" class="number" style="font-size:22px">2</text>
      <text x="453" y="329" class="label">오송선하마루</text>
      <text x="453" y="351" class="hint" style="font-size:15px">만나고 배우는 곳</text>
    </g>
    <text x="528" y="380" text-anchor="middle" font-size="14">선하마루는 역 2층 3번 출구 방면</text>
    <path class="leader" d="M683 305H713"/>
    <circle cx="737" cy="305" r="29" fill="#e98064" stroke="#fffef8" stroke-width="5"/>
    <text x="737" y="313" class="number" style="font-size:22px">1·2</text>
    <text x="737" y="355" text-anchor="middle" class="hint" style="font-size:15px">같은 대표 위치</text>
  </g>

  <path class="leader" d="M166 311V326"/>
  <g filter="url(#soft-shadow)" data-place-id="park">
    <rect x="48" y="222" width="270" height="89" rx="18" class="card"/>
    <text x="69" y="254" font-size="21">정중근린공원 물놀이장</text>
    <text x="69" y="286" class="hint">함께 놀고 쉬는 곳</text>
  </g>
  <circle cx="166" cy="352" r="26" fill="#3d8069" stroke="#fffef8" stroke-width="5"/>
  <text x="166" y="361" class="number">3</text>

  <path class="leader" d="M595 473L644 490"/>
  <g filter="url(#soft-shadow)" data-place-id="center">
    <rect x="296" y="432" width="299" height="80" rx="18" class="card"/>
    <text x="319" y="464" font-size="23">오송읍 행정복지센터</text>
    <text x="319" y="493" class="hint">마을의 여러 일을 돕는 곳</text>
  </g>
  <circle cx="665" cy="496" r="26" fill="#3d8069" stroke="#fffef8" stroke-width="5"/>
  <text x="665" y="505" class="number">5</text>

  <g transform="translate(815 128)">
    <text x="0" y="0" text-anchor="middle" font-size="20">북</text>
    <path d="M0 12l-11 28 11-5 11 5Z" fill="#345f4d"/>
    <path d="M0 36v29" stroke="#345f4d" stroke-width="3" stroke-linecap="round"/>
    <text x="0" y="88" text-anchor="middle" font-size="14" fill="#64776b">N</text>
  </g>
  <text x="53" y="137" font-size="18">어디에 있을까요?</text>
  <text x="53" y="165" class="hint">번호를 찾아 탐험해요.</text>
  <text x="52" y="505" font-size="14" fill="#64776b">점선은 이름표 연결선이에요.</text>
  <path d="M35 548H865" stroke="#dce4d3" stroke-width="1.5"/>
  <text x="450" y="578" text-anchor="middle" font-size="18">실제 좌표의 위치 관계를 단순화했어요 · 축척 없음 · 길 안내용 아님</text>
</svg>
